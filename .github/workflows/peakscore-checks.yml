name: PeakScore checks

on:
  push:
    branches:
      - main
      - feat/founder-intro
  pull_request:
    branches:
      - main

# CI validates repository contents only; dependency updates use a separate,
# reviewed change instead of mutating the branch during validation.
permissions:
  contents: read

concurrency:
  # Keep each commit in its own group so a newer push cannot replace a
  # validation that is already queued for another SHA.
  group: peakscore-checks-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Orby tests, TypeScript, ESLint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Install exactly what this commit declares. Do not rewrite package.json
      # or package-lock.json inside the validation job.
      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          try {
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const summary = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = (item.via ?? []).map((entry) => typeof entry === "string"
                ? { dependency: entry }
                : { title: entry.title, url: entry.url, range: entry.range });
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories,
              }));
            }
            if (Number(summary.total ?? 0) > 0) {
              console.error(`Dependency security gate failed: ${summary.total} vulnerability/vulnerabilities found.`);
              process.exitCode = 1;
            }
          } catch (error) {
            console.error("Could not parse npm audit output:", error.message);
            process.exitCode = 1;
          }
          NODE

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Orby regression tests
        run: npm run test:orby

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js production build
        # The dedicated Orby step above already ran the test suite. Invoke
        # Next directly here to avoid running the same suite a second time.
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-only placeholders: no secrets or production credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-check-service-placeholder

      - name: Enforce dependency audit gate
        if: steps.dependency_audit.outcome == 'failure'
        shell: bash
        run: |
          echo "Dependency security gate failed. TypeScript, ESLint and the production build ran, but unresolved advisories must be fixed before merge."
          exit 1
