name: PeakScore checks

on:
  push:
    branches:
      - main
      - feat/founder-intro
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: peakscore-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
