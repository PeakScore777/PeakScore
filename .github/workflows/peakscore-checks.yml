name: PeakScore checks

on:
  push:
    branches:
      - main
      - feat/founder-intro
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: peakscore-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          try {
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const summary = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = (item.via ?? []).map((entry) => typeof entry === "string"
                ? { dependency: entry }
                : { title: entry.title, url: entry.url, range: entry.range });
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories,
              }));
            }
          } catch (error) {
            console.error("Could not parse npm audit output:", error.message);
            process.exitCode = 1;
          }
          NODE

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: ignore

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint
