name: PeakScore checks

on:
  push:
    branches:
      - main
      - feat/founder-intro
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: peakscore-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve non-breaking security updates
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 eslint-config-next@16.4.3
          npm audit fix --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          try {
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const summary = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency audit summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = (item.via ?? []).map((entry) => typeof entry === "string"
                ? { dependency: entry }
                : { title: entry.title, url: entry.url, range: entry.range });
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories,
              }));
            }
          } catch (error) {
            console.error("Could not parse npm audit output:", error.message);
            process.exitCode = 1;
          }
          NODE

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: ignore

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Commit validated dependency security updates
        if: github.ref == 'refs/heads/feat/founder-intro'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): apply tested security updates"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload tested dependency lockfiles
        uses: actions/upload-artifact@v7
        with:
          name: tested-security-updates
          path: |
            package.json
            package-lock.json
          retention-days: 7
