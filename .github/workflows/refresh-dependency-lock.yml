name: Temporary dependency lock refresh

on:
  push:
    branches:
      - feat/founder-intro
    paths:
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/founder-intro
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh secure compatible framework releases
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6 eslint-config-next@16.4.6 lint-staged@17.6.1
      - name: Apply non-breaking lockfile updates
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Install exact refreshed lockfile
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Regression tests
        run: npm run test:orby
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://build-check.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-check-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-check-service-placeholder
      - name: Commit validated package files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency-file changes to commit."
            exit 0
          fi
          git commit -m "chore(deps): update Next.js security patch"
          git fetch origin feat/founder-intro
          git rebase origin/feat/founder-intro
          git push origin HEAD:feat/founder-intro
