name: PeakScore security scans

on:
  push:
    branches:
      - main
      - feat/founder-intro
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peakscore-security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Daily dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --package-lock-only --audit-level=high

      - name: Scan lockfiles against OSV
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@0e457b42d0120153c352875e9b758b1e5c58c7e5 # v2.7.1
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            ./

      - name: Upload OSV findings to GitHub Security
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: osv-results.sarif

      - name: Retain OSV report
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peakscore-osv-report
          path: osv-results.sarif
          retention-days: 3

  secrets-current-tree:
    name: Daily committed-file secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan the current repository tree
        run: |
          gitleaks dir --redact --no-banner --report-format sarif --report-path gitleaks-tree.sarif . || true
          gitleaks dir --redact --no-banner --report-format json --report-path gitleaks-tree.json . || true
          node <<'NODE'
          const fs = require("node:fs");
          const findings = JSON.parse(fs.readFileSync("gitleaks-tree.json", "utf8"));
          for (const finding of findings) {
            // Never log Secret, Match, or any raw credential material.
            console.error(JSON.stringify({
              rule: finding.RuleID,
              file: finding.File,
              line: finding.StartLine,
              commit: finding.Commit,
              description: finding.Description,
            }));
          }
          if (findings.length > 0) {
            console.error(`Gitleaks found ${findings.length} potential secret(s). Review the redacted report and rotate any confirmed credential.`);
            process.exit(1);
          }
          NODE

      - name: Retain redacted report
        if: ${{ always() && hashFiles('gitleaks-tree.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peakscore-gitleaks-tree
          path: |
            gitleaks-tree.sarif
            gitleaks-tree.json
          retention-days: 3

  secrets-history:
    name: Weekly full Git history secret scan
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 5 * * 0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install pinned Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan all refs and historical commits
        run: |
          gitleaks git --redact --no-banner --report-format sarif --report-path gitleaks-history.sarif .

      - name: Retain redacted historical report
        if: ${{ always() && hashFiles('gitleaks-history.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peakscore-gitleaks-history
          path: gitleaks-history.sarif
          retention-days: 3
