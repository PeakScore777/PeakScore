<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
<defs>
  <filter id="papergrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="19"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
  </filter>
  <radialGradient id="stain">
    <stop stop-color="#79572f" stop-opacity=".15"/>
    <stop offset="1" stop-color="#79572f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="paperedge" x2="1" y2="1">
    <stop stop-color="#fff8e7" stop-opacity=".22"/>
    <stop offset=".52" stop-color="#fff5df" stop-opacity="0"/>
    <stop offset="1" stop-color="#76532d" stop-opacity=".16"/>
  </linearGradient>
</defs>
<rect width="900" height="1200" fill="#e8d8b8"/>
<rect width="900" height="1200" filter="url(#papergrain)" opacity=".58"/>
<ellipse cx="45" cy="120" rx="190" ry="165" fill="url(#stain)"/>
<ellipse cx="850" cy="975" rx="205" ry="185" fill="url(#stain)"/>
<ellipse cx="770" cy="90" rx="120" ry="105" fill="url(#stain)" opacity=".7"/>
<ellipse cx="150" cy="1090" rx="170" ry="110" fill="url(#stain)" opacity=".55"/>
<rect width="900" height="1200" fill="url(#paperedge)"/>
<rect x="8" y="8" width="884" height="1184" fill="none" stroke="#876b43" stroke-opacity=".25" stroke-width="2"/>
</svg>