<text x="834" y="141" fill="#ffe6a8" font-size="26" font-weight="700">03 · NICHO</text><text x="834" y="174" fill="#e8ddc8" font-size="17">¿Cómo vive y qué función cumple?</text>
<!-- food role diagram --> <g><circle cx="880" cy="292" r="29" fill="#5aa76c"/><path d="M868 298Q880 270 895 282Q889 302 868 298" fill="#b4e8a1"/><path d="M910 292H955" stroke="#e5b85d" stroke-width="4"/><path d="M945 283l12 9-12 9" fill="none" stroke="#e5b85d" stroke-width="4"/><g transform="translate(990 292)"><ellipse rx="31" ry="19" fill="#a6db69"/><circle cx="-17" cy="-16" r="10" fill="#b8e879"/><circle cx="17" cy="-16" r="10" fill="#b8e879"/><circle cx="-17" cy="-17" r="4" fill="#102a25"/><circle cx="17" cy="-17" r="4" fill="#102a25"/></g><path d="M1028 292H1070" stroke="#e5b85d" stroke-width="4"/><path d="M1060 283l12 9-12 9" fill="none" stroke="#e5b85d" stroke-width="4"/><g transform="translate(1100 292)"><path d="M-24 0Q0 -30 24 0Q0 30 -24 0" fill="#d4d9b5"/><circle cx="9" cy="-4" r="4" fill="#272016"/></g></g>
<text x="834" y="365" fill="#fef3c7" font-size="16">Planta → rana → depredador</text><text x="834" y="400" fill="#e8ddc8" font-size="15">Usa recursos, se alimenta</text><text x="834" y="424" fill="#e8ddc8" font-size="15">y se relaciona con otras especies.</text><text x="834" y="527" fill="#fff7e2" font-size="18" font-weight="700">Su papel en el ecosistema</text><text x="834" y="556" fill="#e8ddc8" font-size="15">Describe parte de su nicho</text>
