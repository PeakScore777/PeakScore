<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Hábitat, población y nicho ecológico</title><desc id="desc">Tres paneles ilustran el lugar donde viven las ranas, individuos de una misma especie en un área y su función alimentaria dentro del ecosistema.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a25"/><stop offset="1" stop-color="#071714"/></linearGradient></defs><rect width="1200" height="660" rx="28" fill="url(#bg)"/>
<text x="48" y="58" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3">TRES IDEAS QUE NO DEBES CONFUNDIR</text>
<!-- panels --><g font-family="Arial,sans-serif"><rect x="38" y="95" width="356" height="510" rx="20" fill="#10251d" stroke="#5ebf83" stroke-width="2"/><rect x="422" y="95" width="356" height="510" rx="20" fill="#0d2024" stroke="#54c7d5" stroke-width="2"/><rect x="806" y="95" width="356" height="510" rx="20" fill="#272016" stroke="#e5b85d" stroke-width="2"/>
<text x="66" y="141" fill="#b8f4c9" font-size="26" font-weight="700">01 · HÁBITAT</text><text x="66" y="174" fill="#d3e7dc" font-size="17">¿Dónde vive?</text>
