<text x="66" y="527" fill="#f0fdf4" font-size="18" font-weight="700">Orilla húmeda y raíces</text><text x="66" y="556" fill="#b9d5c7" font-size="15">El lugar y sus condiciones</text>
<text x="450" y="141" fill="#b9f4f4" font-size="26" font-weight="700">02 · POBLACIÓN</text><text x="450" y="174" fill="#d3e7dc" font-size="17">¿Cuántos de la misma especie?</text>
