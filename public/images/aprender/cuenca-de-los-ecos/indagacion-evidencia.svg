<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Comparar datos antes de concluir</title><desc id="desc">Diagrama de indagación con dos tramos hipotéticos, dos variables medidas y cuatro pasos para interpretar la evidencia sin confundir asociación y causalidad.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a25"/><stop offset="1" stop-color="#071714"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="url(#bg)"/><text x="44" y="55" fill="#a7f3d0" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="3">DE LOS DATOS A UNA EXPLICACIÓN</text>
<g font-family="Arial,sans-serif"><rect x="42" y="88" width="330" height="176" rx="16" fill="#10251d" stroke="#5ebf83" stroke-width="2"/><rect x="414" y="88" width="330" height="176" rx="16" fill="#0d2024" stroke="#54c7d5" stroke-width="2"/><text x="68" y="125" fill="#b8f4c9" font-size="21" font-weight="700">TRAMO A · HIPOTÉTICO</text><text x="68" y="165" fill="#f0fdf4" font-size="30" font-weight="700">18 ranas</text><text x="68" y="205" fill="#d3e7dc" font-size="22">8 mg/L de oxígeno</text><path d="M68 230H335" stroke="#5ebf83" stroke-width="3"/><text x="440" y="125" fill="#b9f4f4" font-size="21" font-weight="700">TRAMO B · HIPOTÉTICO</text><text x="440" y="165" fill="#f0fdfa" font-size="30" font-weight="700">5 ranas</text><text x="440" y="205" fill="#d3e7dc" font-size="22">3 mg/L de oxígeno</text><path d="M440 230H707" stroke="#54c7d5" stroke-width="3"/>
<path d="M372 174H407" stroke="#d8e7de" stroke-width="3"/><path d="M397 164l11 10-11 10" fill="none" stroke="#d8e7de" stroke-width="3"/>
<rect x="786" y="88" width="370" height="176" rx="16" fill="#272016" stroke="#e5b85d" stroke-width="2"/><text x="812" y="125" fill="#ffe6a8" font-size="21" font-weight="700">¿QUÉ PODEMOS DECIR?</text><text x="812" y="164" fill="#fff7e2" font-size="19">Hay una diferencia observada.</text><text x="812" y="195" fill="#e8ddc8" font-size="17">No demuestra por sí sola</text><text x="812" y="220" fill="#e8ddc8" font-size="17">que el oxígeno sea la causa.</text>
<text x="44" y="310" fill="#d5e8df" font-size="18" font-weight="700">PARA MEJORAR LA INVESTIGACIÓN</text>
<g><rect x="42" y="338" width="250" height="130" rx="14" fill="#0b1d17" stroke="#5ebf83"/><circle cx="76" cy="373" r="17" fill="#5ebf83"/><text x="70" y="380" fill="#062016" font-size="19" font-weight="700">1</text><text x="103" y="379" fill="#d1fae5" font-size="18" font-weight="700">Comparar</text><text x="64" y="418" fill="#b9d5c7" font-size="16">Mismo método y esfuerzo</text><text x="64" y="442" fill="#b9d5c7" font-size="16">en cada tramo.</text>
<rect x="326" y="338" width="250" height="130" rx="14" fill="#0b1d22" stroke="#54c7d5"/><circle cx="360" cy="373" r="17" fill="#54c7d5"/><text x="354" y="380" fill="#062026" font-size="19" font-weight="700">2</text><text x="387" y="379" fill="#b9f4f4" font-size="18" font-weight="700">Repetir</text><text x="348" y="418" fill="#b9d5d9" font-size="16">Medir en distintos</text><text x="348" y="442" fill="#b9d5d9" font-size="16">momentos.</text>
<rect x="610" y="338" width="250" height="130" rx="14" fill="#211d12" stroke="#e5b85d"/><circle cx="644" cy="373" r="17" fill="#e5b85d"/><text x="638" y="380" fill="#2a1b05" font-size="19" font-weight="700">3</text><text x="671" y="379" fill="#ffe6a8" font-size="18" font-weight="700">Considerar</text><text x="632" y="418" fill="#e8ddc8" font-size="16">Temperatura, corriente,</text><text x="632" y="442" fill="#e8ddc8" font-size="16">refugios y otras variables.</text>
<rect x="894" y="338" width="262" height="130" rx="14" fill="#171c2a" stroke="#91a6e8"/><circle cx="928" cy="373" r="17" fill="#91a6e8"/><text x="922" y="380" fill="#0b1230" font-size="19" font-weight="700">4</text><text x="955" y="379" fill="#d9e2ff" font-size="18" font-weight="700">Concluir</text><text x="916" y="418" fill="#c8d2e8" font-size="16">Afirmar solo lo que</text><text x="916" y="442" fill="#c8d2e8" font-size="16">los datos permiten.</text></g></g></svg>